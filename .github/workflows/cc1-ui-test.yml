name: Build CC1 UI test firmware

on:
  push:
    branches:
      - test/cc1-filament-and-leveling
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cc1-ui-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Free space on the disposable GitHub runner
        env:
          RUNNER_ENVIRONMENT_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT_KIND" = github-hosted
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gawk wget git diffstat unzip texinfo build-essential chrpath socat \
            cpio python3 python3-pip python3-pexpect xz-utils debianutils \
            iputils-ping python3-git python3-jinja2 libegl1-mesa-dev \
            libsdl1.2-dev pylint xterm python3-subunit mesa-common-dev \
            zstd liblz4-tool file locales bmap-tools sunxi-tools
          sudo locale-gen en_US.UTF-8
          # Ubuntu restricts the user namespaces BitBake uses for task isolation.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run macro regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Restore previous build downloads and shared state
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: cc1-ui-ubuntu24-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cc1-ui-ubuntu24-v1-${{ github.sha }}-
            cc1-ui-ubuntu24-v1-

      - name: Configure CC1 test build
        shell: bash
        run: |
          set -eo pipefail
          # The distro config loads after local.conf, so set the test version here.
          sed -i 's/^DISTRO_VERSION = ".*"/DISTRO_VERSION = "26.10.1-t1"/' \
            meta-opencentauri/conf/distro/cosmos.conf
          export TEMPLATECONF="$GITHUB_WORKSPACE/meta-opencentauri/conf/templates/opencentauri"
          source openembedded-core/oe-init-build-env build
          cat >> conf/local.conf <<'EOF'
          MACHINE = "centauri-carbon-1"
          INHERIT += "rm_work"
          BB_NUMBER_THREADS = "2"
          PARALLEL_MAKE = "-j4"
          IMAGE_FSTYPES:remove = "zip.sig"
          BB_DISKMON_DIRS:append = " STOPTASKS,${TOPDIR},6G,100K HALT,${TOPDIR},3G,100K"
          EOF
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > source-commit.txt
          git -C "$GITHUB_WORKSPACE" submodule status > source-submodules.txt
          bitbake-getvar --value DISTRO_VERSION | tee distro-version.txt
          test "$(cat distro-version.txt)" = "26.10.1-t1"
          df -h .

      - name: Build CC1 firmware
        shell: bash
        run: |
          set -eo pipefail
          export TEMPLATECONF="$GITHUB_WORKSPACE/meta-opencentauri/conf/templates/opencentauri"
          source openembedded-core/oe-init-build-env build
          # Leave time for saving partial build progress before the job limit.
          timeout --signal=INT --kill-after=300 300m bitbake cosmos 2>&1 | tee build.log

      - name: Verify firmware bundle
        shell: bash
        run: |
          set -euo pipefail
          cd build/tmp/deploy/images/centauri-carbon-1
          test -s cosmos-centauri-carbon-1.swu
          cpio -it < cosmos-centauri-carbon-1.swu > "$GITHUB_WORKSPACE/build/swu-contents.txt"
          sha256sum cosmos-centauri-carbon-1.swu > "$GITHUB_WORKSPACE/build/firmware.sha256"

      - name: Upload test firmware
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-1-ui-test-firmware
          retention-days: 7
          if-no-files-found: error
          path: |
            build/tmp/deploy/images/centauri-carbon-1/cosmos-centauri-carbon-1.swu
            build/firmware.sha256
            build/swu-contents.txt
            build/source-commit.txt
            build/source-submodules.txt
            build/distro-version.txt

      - name: Save build progress for another run
        if: always() && steps.cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc1-ui-test-build-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/build.log
            build/conf/local.conf
            build/source-commit.txt
            build/source-submodules.txt
            build/distro-version.txt
            build/tmp/log/
            build/tmp/work/**/temp/log.do_*
